<!doctype html>
<!--
  LET OP: deze pagina werkt nog niet.

  De schermen zijn af en getest - Gantt, week, maand, taakdetail, bestellingen,
  vaklui, budget - maar ze halen hun gegevens nog op bij /api/..., en die server
  bestaat niet meer. De volgende stap is die aanroepen vervangen door de
  Google Sheets API met inlog, zodat de app zonder server draait.

  De rekenkant zit al wel goed: app/src/domein/ en app/src/data/ zijn serverloos
  en gedekt door tests.
-->
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verbouwing</title>
<style>
  :root {
    --achtergrond: #fbfaf8; --kaart: #fff; --rand: #e3ded6; --tekst: #1c1a17;
    --zacht: #6d675e; --accent: #7a5c3e; --kritiek: #a6432c; --goed: #3d6b45;
    --raster: #efeae2; --vandaag: #c0623f;

    /* Kleur per fase. Vaste volgorde, nooit doorgerouleerd. Gecontroleerd met
       de palet-validator op kleurenblindheid en contrast, licht en donker. */
    --cat-onderzoek: #2a78d6;
    --cat-sloop: #eb6834;
    --cat-ruwbouw: #1baf7a;
    --cat-installatie: #eda100;
    --cat-afwerking: #e87ba4;
    --cat-inrichting: #008300;
    --cat-mijlpaal: #6d675e;
    --cat-afspraak: #6d675e;
    --cat-onbekend: #6d675e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --achtergrond: #171614; --kaart: #211f1c; --rand: #35322d; --tekst: #ece8e1;
      --zacht: #9b948a; --accent: #c8a077; --kritiek: #e08267; --goed: #86bb92;
      --raster: #262421; --vandaag: #e08267;

      /* Dezelfde zes tinten, opnieuw gekozen voor het donkere vlak. */
      --cat-onderzoek: #3987e5;
      --cat-sloop: #d95926;
      --cat-ruwbouw: #199e70;
      --cat-installatie: #c98500;
      --cat-afwerking: #d55181;
      --cat-inrichting: #008300;
      --cat-mijlpaal: #9b948a;
      --cat-afspraak: #9b948a;
      --cat-onbekend: #9b948a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--achtergrond); color: var(--tekst);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 20; background: var(--achtergrond);
    border-bottom: 1px solid var(--rand); padding: 10px 14px;
  }
  h1 { font-size: 16px; margin: 0 0 2px; }
  .meta { color: var(--zacht); font-size: 13px; }
  nav { display: flex; gap: 4px; margin-top: 8px; overflow-x: auto; }
  nav button, .schakel button {
    background: none; border: 1px solid transparent; border-radius: 7px;
    padding: 5px 10px; font: inherit; font-size: 14px; color: var(--zacht);
    cursor: pointer; white-space: nowrap;
  }
  nav button[aria-selected="true"], .schakel button[aria-selected="true"] {
    background: var(--kaart); border-color: var(--rand); color: var(--tekst);
  }
  main { padding: 14px; max-width: 1000px; margin: 0 auto; }
  .balkrij { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  button.actie {
    background: var(--kaart); border: 1px solid var(--rand); border-radius: 7px;
    padding: 5px 11px; font: inherit; font-size: 14px; color: var(--tekst); cursor: pointer;
  }
  button.actie:hover { border-color: var(--accent); }
  .let-op { color: var(--kritiek); }
  .leeg { color: var(--zacht); font-style: italic; }

  .gantt { overflow-x: auto; border: 1px solid var(--rand); border-radius: 10px; background: var(--kaart); }
  .gantt-binnen { position: relative; }
  .as { display: flex; position: sticky; top: 0; z-index: 3; background: var(--kaart);
        border-bottom: 1px solid var(--rand); }
  .as-naam { flex: none; position: sticky; left: 0; z-index: 4; background: var(--kaart);
             border-right: 1px solid var(--rand); }
  .maandkop { font-size: 11px; color: var(--zacht); padding: 3px 6px; border-right: 1px solid var(--rand);
              text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; overflow: hidden; }
  .dagkop { font-size: 10px; color: var(--zacht); text-align: center; border-right: 1px solid var(--raster); }
  .rij { display: flex; align-items: stretch; border-bottom: 1px solid var(--raster); }
  .rij:hover { background: var(--raster); }
  .rij-naam {
    flex: none; position: sticky; left: 0; z-index: 2; background: var(--kaart);
    border-right: 1px solid var(--rand); padding: 5px 8px; font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
  }
  .rij:hover .rij-naam { background: var(--raster); }
  .spoor { position: relative; flex: 1; min-height: 28px; }
  /* De naam staat links in de vaste kolom, dus de balk draagt zelf geen tekst.
     Dat scheelt een contrastprobleem op de lichtere tinten. */
  .balk {
    position: absolute; top: 7px; height: 14px; border-radius: 4px;
    background: var(--cat); cursor: pointer;
  }
  .balk.op-pad { box-shadow: 0 0 0 2px var(--tekst); }
  .balk.af { opacity: .45; }
  .balk.geschat { background-image: repeating-linear-gradient(45deg,
    rgba(255,255,255,.35) 0 4px, transparent 4px 8px); }
  .rij-naam i { display: inline-block; width: 8px; height: 8px; border-radius: 2px;
                background: var(--cat); margin-right: 6px; flex: none; }
  .nu { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--vandaag); z-index: 1; }

  /* --- Kaartje, gedeeld door week- en maandweergave --- */
  .kaart-taak {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: color-mix(in srgb, var(--cat) 14%, var(--kaart));
    border: 1px solid color-mix(in srgb, var(--cat) 30%, var(--kaart));
    border-left: 3px solid var(--cat);
    border-radius: 5px; padding: 4px 6px; margin-bottom: 3px;
    font: inherit; font-size: 12px; line-height: 1.3; color: var(--tekst);
  }
  .kaart-taak:hover { border-color: var(--cat); }
  .kaart-taak b { font-weight: 500; display: block; }
  .kaart-taak small { color: var(--zacht); font-size: 11px; }
  /* Geen bouwwerk: omlijnd in plaats van gevuld. */
  .kaart-taak.geen-werk { background: transparent; border-style: dashed; }
  .kaart-taak.af { opacity: .55; }
  .kaart-taak.af b { text-decoration: line-through; }
  .kaart-taak.op-pad { box-shadow: inset 2px 0 0 0 var(--tekst); }

  /* --- Week: zeven dagen naast elkaar --- */
  .week { display: grid; grid-template-columns: repeat(7, minmax(126px, 1fr));
          gap: 6px; overflow-x: auto; padding-bottom: 4px; align-items: start; }
  .kolom { min-width: 0; }
  .kolom > h3 {
    margin: 0 0 6px; padding-bottom: 4px; font-size: 12px; font-weight: 600;
    color: var(--zacht); border-bottom: 1px solid var(--rand); white-space: nowrap;
  }
  .kolom.weekend > h3 { opacity: .6; }
  .kolom.nu-dag > h3 { color: var(--vandaag); border-bottom-color: var(--vandaag); }

  /* --- Maand --- */
  .maand { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .maand .kop { font-size: 11px; color: var(--zacht); text-align: center; padding: 2px; }
  .cel { background: var(--kaart); border: 1px solid var(--rand); border-radius: 7px;
         min-height: 96px; padding: 4px; cursor: pointer; min-width: 0; }
  .cel.buiten { opacity: .4; }
  .cel.nu-dag { border-color: var(--vandaag); }
  .cel > b { display: block; font-weight: 500; color: var(--zacht); font-size: 11px; margin-bottom: 3px; }
  .cel .kaart-taak { font-size: 11px; padding: 2px 4px; margin-bottom: 2px;
                     white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cel .meer { font-size: 10px; color: var(--zacht); }

  /* Op een telefoon passen er geen zeven leesbare kolommen naast elkaar in een
     maand. Daar wordt elke taak een stip; tik een dag aan en de lijst eronder
     is wel gewoon te lezen. De week blijft naast elkaar staan en scrolt. */
  @media (max-width: 640px) {
    .cel { min-height: 56px; }
    .cel .kaart-taak {
      display: inline-block; width: 9px; height: 9px; border-radius: 50%;
      padding: 0; margin: 0 3px 3px 0; border: none; background: var(--cat);
    }
    .cel .kaart-taak.geen-werk { background: transparent; border: 1px solid var(--zacht); }
    .cel .kaart-taak b, .cel .kaart-taak small { display: none; }
    .cel .meer { font-size: 9px; }
    #dagdetail { scroll-margin-top: 90px; }
  }

  /* --- Waarschuwingen --- */
  .melding {
    background: var(--kaart); border: 1px solid var(--rand);
    border-left: 3px solid var(--zacht); border-radius: 8px;
    padding: 8px 11px; margin-bottom: 6px; font-size: 13px; cursor: pointer;
    display: block; width: 100%; text-align: left; font-family: inherit; color: var(--tekst);
  }
  .melding.kritiek { border-left-color: var(--kritiek); }
  .melding.let-op { border-left-color: var(--accent); }
  .melding b { display: block; font-weight: 500; margin-bottom: 1px; }
  .melding small { color: var(--zacht); }
  .melding .soort {
    display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--zacht); border: 1px solid var(--rand); border-radius: 4px;
    padding: 0 4px; margin-right: 6px; vertical-align: 1px;
  }
  .rustig { color: var(--goed); font-size: 13px; margin: 0 0 10px; }

  /* --- Legenda --- */
  .legenda { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 12px;
             padding-top: 10px; border-top: 1px solid var(--rand); font-size: 12px; color: var(--zacht); }
  .legenda span { display: inline-flex; align-items: center; gap: 5px; }
  .legenda i { width: 11px; height: 11px; border-radius: 3px; background: var(--cat);
               border: 1px solid var(--cat); }
  .legenda i.omlijnd { background: transparent; border: 1px dashed var(--zacht); }
  .legenda i.pad { background: transparent; border: none; box-shadow: inset 3px 0 0 0 var(--tekst);
                   border-radius: 0; }

  .groep { margin-bottom: 20px; }
  .groep h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em;
              color: var(--zacht); margin: 0 0 7px; font-weight: 600; }
  .taak { display: flex; gap: 9px; align-items: baseline; background: var(--kaart);
          border: 1px solid var(--rand); border-radius: 9px; padding: 9px 11px;
          margin-bottom: 5px; cursor: pointer; }
  .taak:hover { border-color: var(--accent); }
  .taak .naam { flex: 1; min-width: 0; }
  .taak .naam small { display: block; color: var(--zacht); font-size: 12px; }
  .stip { width: 9px; height: 9px; border-radius: 50%; background: var(--rand); flex: none; }
  .stip.bezig { background: var(--accent); }
  .stip.klaar { background: var(--goed); }
  .duur { color: var(--zacht); font-size: 12px; white-space: nowrap; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: var(--zacht); font-weight: 600; font-size: 12px; padding: 5px 7px; }
  td { padding: 7px; border-top: 1px solid var(--rand); vertical-align: top; }
  .staaf { height: 6px; background: var(--rand); border-radius: 3px; overflow: hidden; min-width: 55px; }
  .staaf div { height: 100%; background: var(--accent); }

  dialog { border: 1px solid var(--rand); border-radius: 12px; background: var(--kaart);
           color: var(--tekst); max-width: 560px; width: calc(100% - 28px); padding: 18px; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h3 { margin: 0 0 3px; font-size: 16px; }
  dialog ul { margin: 3px 0 0; padding-left: 17px; color: var(--zacht); font-size: 14px; }
  .knoprij { display: flex; gap: 6px; flex-wrap: wrap; margin: 11px 0; }
  textarea { width: 100%; border: 1px solid var(--rand); border-radius: 7px; padding: 7px;
             font: inherit; font-size: 14px; background: var(--achtergrond); color: var(--tekst); }
</style>
</head>
<body>
<header>
  <h1>Verbouwing</h1>
  <div class="meta" id="kop">Laden...</div>
  <nav id="tabs"></nav>
</header>
<main id="inhoud"></main>
<dialog id="detail"></dialog>

<script type="module">
const $ = (s) => document.querySelector(s);
const haal = (p, o) => fetch(p, o).then((r) => r.json());
const veilig = (s) => String(s ?? '').replace(/[<>&]/g, (c) => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

const DAG = 86400000;
const dat = (s) => new Date(s + 'T00:00:00Z');
const iso = (d) => d.toISOString().slice(0, 10);
const plus = (s, n) => iso(new Date(dat(s).getTime() + n * DAG));
const tussen = (a, b) => Math.round((dat(b) - dat(a)) / DAG);
const VANDAAG = iso(new Date());

const kort = (s) => dat(s).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short', timeZone: 'UTC' });
const dagNaam = (s) => dat(s).toLocaleDateString('nl-NL', { weekday: 'long', timeZone: 'UTC' });
const maandNaam = (s) => dat(s).toLocaleDateString('nl-NL', { month: 'long', year: 'numeric', timeZone: 'UTC' });

const TABS = [['planning','Planning'],['taken','Taken'],['vaklui','Vaklui'],
              ['bestellingen','Bestellingen'],['budget','Budget']];
let actief = 'planning';
let weergave = 'gantt';
let anker = VANDAAG;
let planning = null;
let waarschuwingen = null;

const loopt = (t, dag) => t.start <= dag && dag <= t.eind;

/**
 * Wie er nu ingelogd is. Notities gaan op naam, en die naam komt straks uit de
 * Google-inlog in plaats van uit de code. Zolang die er nog niet is, staat er
 * iets neutraals.
 */
let profiel = null;
const ingelogdeNaam = () => profiel?.naam ?? 'onbekend';

function tekenTabs() {
  $('#tabs').innerHTML = TABS.map(([id, label]) =>
    `<button data-tab="${id}" aria-selected="${id === actief}">${label}</button>`).join('');
  $('#tabs').onclick = (e) => {
    const tab = e.target.closest('button')?.dataset.tab;
    if (tab) { actief = tab; tekenTabs(); teken(); }
  };
}

async function kop() {
  const o = await haal('/api/overzicht');
  const laatste = o.sync.map((s) => s.laatste_ververs).sort().at(-1);
  const stukjes = [`${o.tellingen.taken} taken`, `${o.tellingen.klaar} klaar`];
  if (o.tellingen.nietIngedeeld) {
    stukjes.push(`<span class="let-op">${o.tellingen.nietIngedeeld} niet ingedeeld</span>`);
  }
  $('#kop').innerHTML = `${stukjes.join(' &middot; ')} &middot; ververst ${veilig((laatste ?? 'nooit').slice(0, 16))}
    <button class="actie" id="ververs" style="margin-left:6px">Verversen</button>`;
  $('#ververs').onclick = async (e) => {
    e.target.disabled = true; e.target.textContent = 'Bezig...';
    const r = await haal('/api/ververs', { method: 'POST' });
    alert(r.fout ? `Verversen mislukt: ${r.fout}`
      : `Bijgewerkt: ${r.bijgewerkt} taken, ${r.nieuw.length} nieuw, ${r.verdwenen.length} verdwenen.`);
    planning = null; waarschuwingen = null; kop(); teken();
  };
}

async function haalPlanning() {
  if (!planning) planning = await haal('/api/planning');
  return planning;
}

async function haalWaarschuwingen() {
  if (!waarschuwingen) waarschuwingen = await haal('/api/waarschuwingen');
  return waarschuwingen;
}

const SOORT_LABEL = { volgorde: 'volgorde', 'krappe-planning': 'krap', levertijd: 'levertijd' };

async function tekenPlanning() {
  const p = await haalPlanning();
  const meldingen = await haalWaarschuwingen();
  const knoppen = [['gantt','Gantt'],['week','Week'],['maand','Maand']]
    .map(([id, l]) => `<button data-weergave="${id}" aria-selected="${weergave === id}">${l}</button>`).join('');

  const waarschuwing = p.kringloop
    ? `<p class="let-op">De regels spreken elkaar tegen: er zit een kringloop in de volgorde.
       De planning hieronder is daardoor onvolledig.</p>` : '';

  const meldingblok = meldingen.length
    ? meldingen.map((m) => `
        <button class="melding ${m.ernst}" ${m.taakId ? `data-id="${m.taakId}"` : ''}>
          <b><span class="soort">${SOORT_LABEL[m.soort] ?? m.soort}</span>${veilig(m.kop)}</b>
          <small>${veilig(m.uitleg)}</small>
        </button>`).join('')
    : '<p class="rustig">Geen waarschuwingen: volgorde, planning en levertijden kloppen.</p>';

  $('#inhoud').innerHTML = `
    <div class="balkrij">
      <div class="schakel" id="weergaven">${knoppen}</div>
      <span style="flex:1"></span>
      <span class="meta" id="bereik"></span>
    </div>
    ${waarschuwing}
    <div id="meldingen" style="margin-bottom:14px">${meldingblok}</div>
    <div id="weergavevak"></div>`;

  $('#weergaven').onclick = (e) => {
    const w = e.target.closest('button')?.dataset.weergave;
    if (w) { weergave = w; anker = VANDAAG; tekenPlanning(); }
  };

  $('#meldingen').onclick = (e) => {
    const id = e.target.closest('.melding')?.dataset.id;
    if (id) toonDetail(id);
  };

  if (weergave === 'gantt') tekenGantt(p);
  if (weergave === 'week') tekenWeek(p);
  if (weergave === 'maand') tekenMaand(p);
}

function tekenGantt(p) {
  const begin = p.begin, einde = p.einde;
  const dagen = tussen(begin, einde) + 1;
  const smal = window.innerWidth < 700;
  const bd = smal ? 12 : 22;
  const naamBreedte = smal ? 120 : 230;

  $('#bereik').textContent = `${kort(begin)} tot ${kort(einde)}, ${dagen} dagen`;

  const maanden = [];
  for (let i = 0; i < dagen; i++) {
    const d = plus(begin, i);
    const sleutel = d.slice(0, 7);
    if (!maanden.length || maanden.at(-1).sleutel !== sleutel) {
      maanden.push({ sleutel, label: maandNaam(d), dagen: 1 });
    } else maanden.at(-1).dagen++;
  }

  const dagkoppen = Array.from({ length: dagen }, (_, i) => {
    const d = plus(begin, i);
    return `<div class="dagkop" style="width:${bd}px">${smal ? '' : dat(d).getUTCDate()}</div>`;
  }).join('');

  const rijen = p.taken.map((t) => {
    const links = tussen(begin, t.start) * bd;
    const breed = Math.max(bd * Math.max(t.duur, 1), 8);
    const klassen = ['balk', t.kritiek ? 'op-pad' : '', t.status === 'klaar' ? 'af' : '',
                     t.duurGeschat ? 'geschat' : ''].filter(Boolean).join(' ');
    return `<div class="rij" style="--cat:var(--cat-${t.categorie})">
      <div class="rij-naam" style="width:${naamBreedte}px" data-id="${t.id}"
           title="${veilig(t.naam)}"><i></i>${veilig(t.naam)}</div>
      <div class="spoor" style="width:${dagen * bd}px">
        <div class="${klassen}" style="left:${links}px;width:${breed}px" data-id="${t.id}"
             title="${veilig(t.naam)} (${t.start} tot ${t.eind})"></div>
      </div>
    </div>`;
  }).join('');

  const nuLinks = VANDAAG >= begin && VANDAAG <= einde
    ? `<div class="nu" style="left:${naamBreedte + tussen(begin, VANDAAG) * bd}px"></div>` : '';

  $('#weergavevak').innerHTML = `
    <div class="gantt"><div class="gantt-binnen" style="width:${naamBreedte + dagen * bd}px">
      <div class="as">
        <div class="as-naam" style="width:${naamBreedte}px">
          <div class="maandkop">taak</div><div class="dagkop">&nbsp;</div>
        </div>
        <div>
          <div style="display:flex">${maanden.map((m) =>
            `<div class="maandkop" style="width:${m.dagen * bd}px">${m.label}</div>`).join('')}</div>
          <div style="display:flex">${dagkoppen}</div>
        </div>
      </div>
      ${nuLinks}
      ${rijen}
    </div></div>
    ${legenda()}
    <p class="meta" style="margin-top:6px">
      Gestreept betekent dat de duur niet in de sheet stond en op een dag is gezet.</p>`;

  $('#weergavevak').onclick = (e) => {
    const id = e.target.closest('[data-id]')?.dataset.id;
    if (id) toonDetail(id);
  };
}

const CATEGORIEN = [
  ['onderzoek', 'Onderzoek en voorbereiding'],
  ['sloop', 'Sloop'],
  ['ruwbouw', 'Ruwbouw'],
  ['installatie', 'Installatie'],
  ['afwerking', 'Afwerking'],
  ['inrichting', 'Inrichting'],
];
const GEEN_WERK = new Set(['mijlpaal', 'afspraak', 'onbekend']);

function legenda() {
  return `<div class="legenda">
    ${CATEGORIEN.map(([id, label]) =>
      `<span style="--cat:var(--cat-${id})"><i></i>${label}</span>`).join('')}
    <span><i class="omlijnd"></i>Mijlpaal of afspraak</span>
    <span><i class="pad"></i>Kritiek pad</span>
  </div>`;
}

/** Een kaartje draagt zijn eigen naam, dus de kleur hoeft niets alleen te dragen. */
function kaartje(t, dag, beknopt) {
  const klassen = ['kaart-taak',
    GEEN_WERK.has(t.categorie) ? 'geen-werk' : '',
    t.status === 'klaar' ? 'af' : '',
    t.kritiek ? 'op-pad' : ''].filter(Boolean).join(' ');

  const fase = dag && t.start === dag ? 'start' : dag && t.eind === dag ? 'klaar' : 'loopt';
  const bij = [fase, veilig(t.werksoort ?? ''), veilig(t.ruimtes ?? '')]
    .filter(Boolean).join(' &middot; ');

  return `<button class="${klassen}" style="--cat:var(--cat-${veilig(t.categorie)})"
    data-id="${t.id}" title="${veilig(t.naam)} (${t.start} tot ${t.eind})">
    <b>${veilig(t.naam)}</b>${beknopt ? '' : `<small>${bij}</small>`}</button>`;
}

function tekenWeek(p) {
  const maandag = plus(anker, -((dat(anker).getUTCDay() + 6) % 7));
  $('#bereik').textContent = `${kort(maandag)} tot ${kort(plus(maandag, 6))}`;

  const kolommen = Array.from({ length: 7 }, (_, i) => plus(maandag, i)).map((d, i) => {
    const bezig = p.taken.filter((t) => loopt(t, d));
    return `<div class="kolom ${i > 4 ? 'weekend' : ''} ${d === VANDAAG ? 'nu-dag' : ''}">
      <h3>${dagNaam(d).slice(0, 2)} ${dat(d).getUTCDate()}</h3>
      ${bezig.map((t) => kaartje(t, d, false)).join('')
        || '<p class="leeg" style="font-size:12px;margin:0">niets</p>'}
    </div>`;
  }).join('');

  $('#weergavevak').innerHTML = `
    <div class="balkrij">
      <button class="actie" data-stap="-7">Vorige</button>
      <button class="actie" data-stap="0">Deze week</button>
      <button class="actie" data-stap="7">Volgende</button>
    </div>
    <div class="week">${kolommen}</div>
    ${legenda()}`;
  koppelNavigatie('week');
}

function tekenMaand(p) {
  const eerste = anker.slice(0, 8) + '01';
  $('#bereik').textContent = maandNaam(eerste);

  const start = plus(eerste, -((dat(eerste).getUTCDay() + 6) % 7));
  const cellen = Array.from({ length: 42 }, (_, i) => plus(start, i)).map((d) => {
    const bezig = p.taken.filter((t) => loopt(t, d));
    const buiten = d.slice(0, 7) !== eerste.slice(0, 7);
    return `<div class="cel ${buiten ? 'buiten' : ''} ${d === VANDAAG ? 'nu-dag' : ''}" data-dag="${d}">
      <b>${dat(d).getUTCDate()}</b>
      ${bezig.slice(0, 3).map((t) => kaartje(t, d, true)).join('')}
      ${bezig.length > 3 ? `<div class="meer">nog ${bezig.length - 3}</div>` : ''}
    </div>`;
  }).join('');

  $('#weergavevak').innerHTML = `
    <div class="balkrij">
      <button class="actie" data-stap="-1">Vorige</button>
      <button class="actie" data-stap="0">Deze maand</button>
      <button class="actie" data-stap="1">Volgende</button>
    </div>
    <div class="maand">
      ${['ma','di','wo','do','vr','za','zo'].map((d) => `<div class="kop">${d}</div>`).join('')}
      ${cellen}
    </div>
    ${legenda()}
    <div id="dagdetail"></div>`;

  koppelNavigatie('maand');

  $('.maand').onclick = (e) => {
    if (e.target.closest('.kaart-taak')) return;   // dat opent het taakdetail
    const d = e.target.closest('.cel')?.dataset.dag;
    if (!d) return;
    const bezig = p.taken.filter((t) => loopt(t, d));
    $('#dagdetail').innerHTML = `<div class="groep" style="margin-top:16px">
      <h2>${dagNaam(d)} ${kort(d)}</h2>
      ${bezig.map((t) => kaartje(t, d, false)).join('') || '<p class="leeg">Niets gepland.</p>'}
    </div>`;
  };
}

function koppelNavigatie(soort) {
  const vak = $('#weergavevak');
  vak.querySelectorAll('[data-stap]').forEach((knop) => {
    knop.onclick = () => {
      const n = Number(knop.dataset.stap);
      if (n === 0) anker = VANDAAG;
      else if (soort === 'maand') {
        const d = dat(anker.slice(0, 8) + '01');
        d.setUTCMonth(d.getUTCMonth() + n);
        anker = iso(d);
      } else anker = plus(anker, n);
      tekenPlanning();
    };
  });
  vak.addEventListener('click', (e) => {
    const id = e.target.closest('.kaart-taak')?.dataset.id;
    if (id) toonDetail(id);
  });
}

async function tekenTaken() {
  const taken = await haal('/api/taken');
  const perRuimte = new Map();
  for (const t of taken) {
    const s = t.ruimtes || 'geen ruimte';
    perRuimte.set(s, [...(perRuimte.get(s) ?? []), t]);
  }
  const volgorde = [...perRuimte.keys()].sort((a, b) =>
    (a === 'geen ruimte') - (b === 'geen ruimte') || a.localeCompare(b));

  $('#inhoud').innerHTML = volgorde.map((ruimte) => `
    <section class="groep">
      <h2>${veilig(ruimte.replaceAll(',', ' + '))}</h2>
      ${perRuimte.get(ruimte).map((t) => `
        <div class="taak" data-id="${t.id}">
          <span class="stip ${veilig(t.status)}"></span>
          <span class="naam">${veilig(t.naam)}
            <small>${t.werksoort ? veilig(t.werksoort)
              : '<span class="let-op">niet ingedeeld</span>'}${
              t.notities ? ` &middot; ${t.notities} notitie(s)` : ''}</small></span>
          <span class="duur">${t.duur != null ? `${t.duur} d` : ''}</span>
        </div>`).join('')}
    </section>`).join('');

  $('#inhoud').onclick = (e) => {
    const id = e.target.closest('.taak')?.dataset.id;
    if (id) toonDetail(id);
  };
}

async function toonDetail(id) {
  const t = await haal(`/api/taken/${id}`);
  const gepland = (await haalPlanning()).taken.find((x) => x.id === Number(id));
  const lijst = (items, leeg) => items.length
    ? `<ul>${items.map((i) => `<li>${veilig(i.naam)}${i.status === 'klaar' ? ' &#10003;' : ''}</li>`).join('')}</ul>`
    : `<p class="leeg">${leeg}</p>`;

  $('#detail').innerHTML = `
    <h3>${veilig(t.naam)}</h3>
    <div class="meta">${veilig(t.werksoort ?? 'niet ingedeeld')}${
      t.ruimtes ? ' &middot; ' + veilig(t.ruimtes) : ''} &middot; uit ${veilig(t.bron_tabblad ?? 'handmatig')}</div>
    ${gepland ? `<div class="meta">${kort(gepland.start)} tot ${kort(gepland.eind)} &middot;
      ${gepland.duur} dag(en)${gepland.duurGeschat ? ' (geschat)' : ''} &middot;
      ${gepland.kritiek ? '<span class="let-op">kritiek pad</span>'
        : `${gepland.speling} dagen speling`}</div>` : ''}
    <div class="knoprij">
      ${['te-doen','bezig','klaar'].map((s) =>
        `<button class="actie" data-status="${s}"${
          s === t.status ? ' style="border-color:var(--accent)"' : ''}>${s}</button>`).join('')}
    </div>
    <p class="meta"><strong>Moet hiervoor klaar zijn</strong></p>${lijst(t.ervoor, 'Niets, dit kan meteen.')}
    <p class="meta" style="margin-top:10px"><strong>Wacht hierop</strong></p>${lijst(t.erna, 'Niets.')}
    <p class="meta" style="margin-top:10px"><strong>Notities</strong></p>
    ${t.notitielijst.map((n) => `<p style="font-size:14px;margin:4px 0">${veilig(n.tekst)}<br>
      <span class="meta">${veilig(n.auteur)} &middot; ${veilig(n.gemaakt_op)}</span></p>`).join('')
      || '<p class="leeg">Nog geen notities.</p>'}
    <textarea id="nieuwe-notitie" rows="2" placeholder="Notitie toevoegen"></textarea>
    <div class="knoprij">
      <button class="actie" id="notitie-opslaan">Opslaan als ${veilig(ingelogdeNaam())}</button>
      <span style="flex:1"></span>
      <button class="actie" id="sluit">Sluiten</button>
    </div>`;

  $('#detail').onclick = async (e) => {
    const knop = e.target.closest('button');
    if (!knop) return;
    if (knop.dataset.status) {
      await fetch(`/api/taken/${id}/status`, {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ status: knop.dataset.status }),
      });
      $('#detail').close(); planning = null; waarschuwingen = null; kop(); teken();
    }
    if (knop.id === 'notitie-opslaan') {
      const tekst = $('#nieuwe-notitie').value.trim();
      if (!tekst) return;
      await fetch(`/api/taken/${id}/notities`, {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ tekst, auteur: ingelogdeNaam() }),
      });
      $('#detail').close(); teken();
    }
    if (knop.id === 'sluit') $('#detail').close();
  };
  $('#detail').showModal();
}

async function tekenVaklui() {
  const groepen = await haal('/api/vaklui');
  $('#inhoud').innerHTML = groepen.map((g) => `
    <section class="groep">
      <h2>${veilig(g.functie)}${g.bekend ? '' : ' <span class="let-op">(onbekende functie)</span>'}</h2>
      <table><tbody>${g.kandidaten.map((v) => `<tr>
        <td><strong>${veilig(v.bedrijf)}</strong><br>
          <span class="meta">${veilig(v.status || v.benaderd || '')}</span></td>
        <td class="meta">${veilig(v.telefoon || '')}</td>
      </tr>`).join('')}</tbody></table>
      <p class="meta" style="margin-top:5px">${g.kandidaten.length} kandidaat(en), nog niemand aangekruist.</p>
    </section>`).join('');
}

async function tekenBestellingen() {
  const lijst = await haal('/api/bestellingen');
  $('#inhoud').innerHTML = `<table>
    <thead><tr><th>Item</th><th>Leverancier</th><th>Levertijd</th><th>Nodig op</th></tr></thead>
    <tbody>${lijst.map((b) => `<tr>
      <td>${b.link ? `<a href="${veilig(b.link)}" target="_blank" rel="noopener">${veilig(b.naam)}</a>`
        : veilig(b.naam)}<br><span class="meta">${veilig(b.prijs || '')}</span></td>
      <td>${veilig(b.leverancier || '')}</td>
      <td class="meta">${veilig(b.levertijd || '')}</td>
      <td>${b.datumNodig ? veilig(b.datumNodig) : '<span class="let-op">niet ingevuld</span>'}</td>
    </tr>`).join('')}</tbody></table>`;
}

async function tekenBudget() {
  const cats = await haal('/api/budget');
  const euro = (n) => n == null ? '' : `&euro; ${Math.round(n).toLocaleString('nl-NL')}`;
  $('#inhoud').innerHTML = ['verbouwkosten', 'allocatie'].map((blok) => {
    const rij = cats.filter((c) => c.blok === blok);
    if (!rij.length) return '';
    const begroot = rij.reduce((a, c) => a + (c.herzien ?? c.begroot ?? 0), 0);
    const uit = rij.reduce((a, c) => a + c.uitgegeven, 0);
    return `<section class="groep">
      <h2>${blok} &mdash; ${euro(uit)} van ${euro(begroot)}</h2>
      <table><thead><tr><th>Categorie</th><th>Begroot</th><th>Uitgegeven</th><th></th></tr></thead>
      <tbody>${rij.map((c) => {
        const doel = c.herzien ?? c.begroot ?? 0;
        const deel = doel ? Math.min(100, (c.uitgegeven / doel) * 100) : 0;
        return `<tr><td>${veilig(c.naam)}</td><td class="meta">${euro(doel)}</td>
          <td${c.uitgegeven > doel ? ' class="let-op"' : ''}>${euro(c.uitgegeven)}</td>
          <td><div class="staaf"><div style="width:${deel}%"></div></div></td></tr>`;
      }).join('')}</tbody></table>
    </section>`;
  }).join('');
}

const tekenaars = { planning: tekenPlanning, taken: tekenTaken, vaklui: tekenVaklui,
                    bestellingen: tekenBestellingen, budget: tekenBudget };
const teken = () => tekenaars[actief]();

let hertekenTimer;
window.addEventListener('resize', () => {
  if (actief !== 'planning' || weergave !== 'gantt') return;
  clearTimeout(hertekenTimer);
  hertekenTimer = setTimeout(tekenPlanning, 150);
});

tekenTabs();
await kop();
await teken();
</script>
</body>
</html>
